[metadata]
name = miniforge
version = 2.0.0
description = AI Coding Assistant for Local Models
long_description = file: README.md
long_description_content_type = text/markdown

[options]
packages = find:
python_requires = >=3.8
install_requires =
    requests

[options.packages.find]
where = .

[options.entry_points]
console_scripts =
    miniforge = miniforge.__main__:main
